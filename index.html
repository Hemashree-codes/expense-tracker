<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Expense Tracker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <!-- ========================================
             MAIN HEADING
        ========================================= -->

        <h1>💰 Expense Tracker</h1>


        <!-- ========================================
             SUMMARY
        ========================================= -->

        <section class="summary">

            <div class="card">
                <h3>Total Balance</h3>
                <p id="balance">₹0</p>
            </div>

            <div class="card">
                <h3>Income</h3>
                <p id="income">₹0</p>
            </div>

            <div class="card">
                <h3>Expenses</h3>
                <p id="expenses">₹0</p>
            </div>

        </section>


        <!-- ========================================
             CHART
        ========================================= -->

        <section class="charts">

            <h2>Financial Overview</h2>

            <canvas id="financeChart"></canvas>

        </section>


        <!-- ========================================
             ADD TRANSACTION
        ========================================= -->

        <section class="transaction-form">

            <h2>Add Transaction</h2>


            <!-- Description -->

            <input
                type="text"
                id="description"
                placeholder="Description"
            >


            <!-- Amount -->

            <input
                type="number"
                id="amount"
                placeholder="Amount"
            >


            <!-- Type -->

            <select id="type">

                <option value="income">
                    Income
                </option>

                <option value="expense">
                    Expense
                </option>

            </select>


            <!-- Category -->

            <select id="category">

                <option value="Salary">
                    Salary
                </option>

                <option value="Food">
                    Food
                </option>

                <option value="Shopping">
                    Shopping
                </option>

                <option value="Travel">
                    Travel
                </option>

                <option value="Bills">
                    Bills
                </option>

                <option value="Education">
                    Education
                </option>

                <option value="Other">
                    Other
                </option>

            </select>


            <!-- Date -->

            <input
                type="date"
                id="date"
            >


            <!-- Add Button -->

            <button id="addBtn">
                Add Transaction
            </button>

        </section>


        <!-- ========================================
             TRANSACTIONS
        ========================================= -->

        <section class="transactions">

            <h2>Transactions</h2>


            <!-- Search -->

            <input
                type="text"
                id="searchInput"
                placeholder="🔍 Search transactions..."
            >


            <!-- Filter -->

            <select id="filterType">

                <option value="all">
                    All
                </option>

                <option value="income">
                    Income
                </option>

                <option value="expense">
                    Expenses
                </option>

            </select>


            <!-- Transaction List -->

            <div id="transactionList">

                <!-- Transactions will appear here -->

            </div>

        </section>

    </main>


    <!-- ========================================
         CHART.JS
    ========================================= -->

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>


    <!-- ========================================
         JAVASCRIPT
    ========================================= -->

    <script src="script.js"></script>

</body>

</html>
